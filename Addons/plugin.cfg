[plugin]

name="TextureGenerator"

description="This Godot plug-in will allow a user to select parameters from an 
    on-screen form to develop a procedurally generated 3D room or set of rooms. 
    Users may modify parameters between generations. Parameters include selections 
    like adding furniture to populate a room, the number of rooms to generate, 
    the distance between room walls, or the size of rooms. Once generated, users 
    may modify their environments without necessitating further use of the plug-in. 
    All room generations will be built using a simple snap grid layout."

author="Nick Dillon, Owen Fankhauser, Gabe Hardy-Fowler, Brayden Miranda, Kelsey Roberts"
version=""
script="texturegenerator.gd"
